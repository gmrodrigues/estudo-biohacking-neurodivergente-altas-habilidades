schema_version: 1
id: cycle-004-selection-sensitivity
status: registered_local_after_cycle001_results
question: Os contrastes principais permanecem semelhantes após reponderar casos completos pela inclusão observável?
created_at: "2026-09-10"
data_already_inspected:
  - cycle-001 coefficients and significance
  - cycle-002 selection counts and degrees-of-freedom sensitivity
  - cycle-003 magnesium measurement states
external_registration: none
population:
  eligibility: NHANES 2021-2023, 20-80 anos, junções da hipótese, peso do componente positivo e desenho observado
  age_range: [20, 80]
  group_measurement: diagnostic groups not assessed
  comparison_plan: [complete-case reference, inverse-probability weighted complete cases, p99-truncated sensitivity]
data:
  sources_and_versions: [NHANES August 2021-August 2023]
  audit_path: research/discoveries/cycle-002/data-audit.md
  exposure_fields: [DR1TCAFF, SLD012, PAD680, DR1TMAGN, DSQTMAGN]
  outcome_fields: [SLD012, modified symptom score excluding DPQ030]
  time_windows: cross-sectional; one-day dietary recall, usual weekday sleep, two-week symptoms, 30-day supplements
estimand:
  type: adjusted cross-sectional association under observable response reweighting
  exposure_contrast: same eight contrasts as cycle 001
  comparator: original complete-case estimates
  outcome_and_unit: hours of sleep or points in modified symptom score
  predicted_direction_or_range: no directional prediction for coefficient changes
  smallest_effect_of_interest: none; report continuous coefficient changes and intervals
  identification_limits: [unmeasured selection, exposure and outcome missingness, cross-sectional temporality]
causal_structure:
  dag: selection sensitivity only; no causal estimand identified
  confounders: [age, sex, race_ethnicity, education, income, energy where registered]
  mediators: []
  effect_modifiers: [age only in registered H1 interaction]
analysis:
  primary_model: registered cycle-001 models with inverse-probability-of-complete-case weights
  sampling_design: NHANES component weight, strata and PSU; primary df equals represented PSU minus strata
  missing_data_strategy: response propensity from age, age squared, sex, race_ethnicity and stratum; inverse probability weighting
  multiplicity_family: eight frozen primary contrasts
  multiplicity_method: Benjamini-Hochberg
  uncertainty_method: Taylor linearization treating estimated response weights as fixed; t with design df
  sensitivity_analyses: [untruncated response weights, response weights truncated at p99, residual df from svy retained as prior sensitivity]
  falsification_rule: large coefficient movement or poor propensity overlap weakens robustness to observed selection
  replication_plan: independent NHANES wave or harmonized external dataset
  evidence_selection_protocol: research/discoveries/cycle-004/protocol.md
execution:
  state: executed
  command: MPLCONFIGDIR=/tmp/science-matplotlib PIPENV_VENV_IN_PROJECT=1 pipenv run python research/discoveries/cycle-004/run_analysis.py
