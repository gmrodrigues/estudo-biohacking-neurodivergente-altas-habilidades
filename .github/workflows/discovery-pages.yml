name: Discovery results site

on:
  push:
    branches: [main]
    paths:
      - 'research/discoveries/**'
      - 'scripts/build_discovery_site.py'
      - 'tests/test_discovery_site.py'
      - 'Pipfile*'
      - '.github/workflows/discovery-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: discovery-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_cycles: ${{ steps.cycles.outputs.has_cycles }}
    env:
      PIPENV_VENV_IN_PROJECT: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Bootstrap Pipenv
        run: pipx install pipenv
      - name: Install locked project dependencies
        run: pipenv sync --dev
      - name: Test publication contract
        run: pipenv run python -m unittest discover -s tests -v
      - name: Build site
        run: pipenv run python scripts/build_discovery_site.py --output _site
      - name: Check completed cycles
        id: cycles
        run: |
          pipenv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          available = bool(json.loads(Path('_site/cycles.json').read_text()))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'has_cycles={str(available).lower()}\n')
          PY
      - uses: actions/configure-pages@v6
        if: steps.cycles.outputs.has_cycles == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.cycles.outputs.has_cycles == 'true'
        with:
          path: _site

  deploy:
    if: needs.build.outputs.has_cycles == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
